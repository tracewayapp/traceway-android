name: Unit tests

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jvm:
    name: JVM unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3

      # Always build via the committed ./gradlew (Gradle 8.9, AGP 8.7, Kotlin 2.0).
      # Never invoke the runner's system `gradle`: configuring this build applies
      # the com.tracewayapp.symbols plugin from the included gradle-plugin build,
      # compiled with Kotlin 1.9, which can't read newer stdlib metadata.
      - name: Test release and device workflows offline
        run: python3 scripts/tests/test_workflows.py

      - name: Run unit tests
        run: ./gradlew :traceway:testDebugUnitTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traceway-unit-test-report
          path: traceway/build/reports/tests/testDebugUnitTest/
