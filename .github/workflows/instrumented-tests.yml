name: Instrumented tests (Firebase Test Lab)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test'
        required: false
        default: 'main'
        type: string
      device:
        description: 'FTL device model (default shiba=Pixel 8)'
        required: false
        default: 'shiba'
        type: string
      api_level:
        description: 'Android API level'
        required: false
        default: '34'
        type: string
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build self-instrumenting androidTest APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3

      # Always build via the committed ./gradlew (Gradle 8.9, AGP 8.7, Kotlin 2.0).
      # Never invoke the runner's system `gradle`: configuring this build applies
      # the com.tracewayapp.symbols plugin from the included gradle-plugin build,
      # compiled with Kotlin 1.9, which can't read newer stdlib metadata.
      - name: Assemble androidTest APK
        run: ./gradlew :traceway:assembleDebugAndroidTest --stacktrace

      - name: Verify the instrumentation APK can install on Android 14
        shell: bash
        run: |
          apk=(traceway/build/outputs/apk/androidTest/debug/*.apk)
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          target=$("$aapt" dump badging "${apk[0]}" | sed -n "s/^targetSdkVersion:'\([0-9]*\)'/\1/p")
          [[ "$target" =~ ^[0-9]+$ && "$target" -ge 23 ]] || { echo "Uninstallable instrumentation APK target SDK: $target"; exit 1; }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: traceway-androidtest-apk
          path: traceway/build/outputs/apk/androidTest/debug/*.apk

  firebase-test-lab:
    name: Run on Firebase Test Lab
    needs: build
    runs-on: ubuntu-latest
    # Only run on pushes/dispatches when GCP secrets are configured. PRs from
    # forks will not have these and would otherwise fail with auth errors.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: traceway-androidtest-apk
          path: ./apks

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Locate androidTest APK
        id: locate
        run: |
          APK=$(find ./apks -type f -name "*-androidTest.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No androidTest APK found"
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Run on Firebase Test Lab
        env:
          DEVICE: ${{ github.event.inputs.device || 'shiba' }}
          API: ${{ github.event.inputs.api_level || '34' }}
        run: |
          # Library-module androidTest APKs are self-instrumenting: pass the
          # same APK as both --app and --test.
          gcloud firebase test android run \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --type instrumentation \
            --app "${{ steps.locate.outputs.apk_path }}" \
            --test "${{ steps.locate.outputs.apk_path }}" \
            --device model=$DEVICE,version=$API,locale=en,orientation=portrait \
            --use-orchestrator \
            --environment-variables clearPackageData=true \
            --timeout 15m \
            --results-dir=instrumented-${{ github.run_id }}-${{ github.run_attempt }} \
            --results-bucket=${{ secrets.GCS_BUCKET }} \
            --record-video

      - name: Download results from GCS
        if: always()
        run: |
          GCS_PATH="gs://${{ secrets.GCS_BUCKET }}/instrumented-${{ github.run_id }}-${{ github.run_attempt }}"
          mkdir -p ./results
          gsutil -m cp -r "$GCS_PATH/" ./results/

      - name: Surface test results
        if: always()
        run: |
          python3 scripts/check-device-results.py ./results

      - name: Upload FTL artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ftl-results-${{ github.run_id }}
          path: ./results/
          if-no-files-found: error
